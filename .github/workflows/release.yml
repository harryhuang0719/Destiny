name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and reproducibly build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      PYTHONHASHSEED: "0"
      RELEASE_TAG: ${{ github.ref_name }}
      TZ: UTC

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.14"
          enable-cache: false

      - name: Require a release-ready tag and metadata set
        id: version
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          fi
          if ! git tag --points-at "$GITHUB_SHA" | grep -Fx -- "$RELEASE_TAG" >/dev/null; then
            echo "The triggering tag does not resolve to the checked-out commit." >&2
            exit 1
          fi

          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          if [[ ! "$source_date_epoch" =~ ^[0-9]+$ ]]; then
            echo "Could not derive SOURCE_DATE_EPOCH from the tagged commit." >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

          python - <<'PY'
          import ast
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          def unsafe_index_entries(payload: bytes) -> list[tuple[str, str]]:
              unsafe = []
              for record in payload.split(b"\0"):
                  if not record:
                      continue
                  metadata, path = record.split(b"\t", 1)
                  mode = metadata.split(b" ", 1)[0]
                  if mode not in {b"100644", b"100755"}:
                      unsafe.append((mode.decode("ascii"), os.fsdecode(path)))
              return unsafe

          adversarial_symlink = (
              b"120000 " + b"0" * 40 + b" 0\tleaks-outside-repository\0"
          )
          if unsafe_index_entries(adversarial_symlink) != [
              ("120000", "leaks-outside-repository")
          ]:
              raise SystemExit("Internal tracked-symlink rejection fixture failed")
          tracked_entries = subprocess.check_output(["git", "ls-files", "-s", "-z"])
          unsafe_entries = unsafe_index_entries(tracked_entries)
          if unsafe_entries:
              details = ", ".join(f"{mode} {path}" for mode, path in unsafe_entries)
              raise SystemExit(
                  "Release source may contain only tracked regular files; "
                  f"symlinks/gitlinks/special modes found: {details}"
              )

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          pyproject_version = str(pyproject["project"]["version"])
          stable_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)"
          )
          if stable_semver.fullmatch(pyproject_version) is None:
              raise SystemExit(
                  "Release version must be stable SemVer MAJOR.MINOR.PATCH without leading zeros"
              )

          build_requirements = pyproject["build-system"]["requires"]
          exact_requirement = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9.!+_-]*")
          unpinned = [item for item in build_requirements if exact_requirement.fullmatch(item) is None]
          if unpinned:
              raise SystemExit(
                  "Every PEP 517 build requirement must be exactly pinned; invalid: "
                  + ", ".join(unpinned)
              )
          if not any(item.startswith("setuptools==") for item in build_requirements):
              raise SystemExit("The setuptools build backend must be exactly pinned")

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          package_lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          metadata = json.loads(Path("_meta.json").read_text(encoding="utf-8"))
          package_init = ast.parse(
              Path("scripts/__init__.py").read_text(encoding="utf-8"),
              filename="scripts/__init__.py",
          )
          runtime_version = None
          for node in package_init.body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(
                  isinstance(target, ast.Name) and target.id == "__version__"
                  for target in node.targets
              ):
                  runtime_version = ast.literal_eval(node.value)
                  break
          if not isinstance(runtime_version, str):
              raise SystemExit("scripts/__init__.py has no string __version__")

          skill_text = Path("SKILL.md").read_text(encoding="utf-8")
          skill_metadata = re.search(
              r"(?m)^metadata:\s*\n(?P<body>(?:^[ \t]+.*(?:\n|$))*)", skill_text
          )
          if skill_metadata is None:
              raise SystemExit("SKILL.md has no metadata frontmatter")
          skill_version = re.search(
              r'(?m)^\s+version:\s*["\']?([^"\'\s]+)["\']?\s*$',
              skill_metadata.group("body"),
          )
          if skill_version is None:
              raise SystemExit("SKILL.md metadata has no version")

          versions = {
              "pyproject.toml": pyproject_version,
              "package.json": str(package["version"]),
              "package-lock.json": str(package_lock["version"]),
              "package-lock.json root": str(package_lock["packages"][""]["version"]),
              "_meta.json": str(metadata["version"]),
              "scripts/__init__.py": runtime_version,
              "SKILL.md": skill_version.group(1),
          }
          mismatches = {name: value for name, value in versions.items() if value != pyproject_version}
          if mismatches:
              details = ", ".join(f"{name}={value}" for name, value in mismatches.items())
              raise SystemExit(f"Version metadata disagrees with {pyproject_version}: {details}")

          tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{pyproject_version}"
          if tag != expected_tag:
              raise SystemExit(f"Tag/version mismatch: expected {expected_tag}, received {tag}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          changelog = changelog.replace("\r\n", "\n").replace("\r", "\n")
          section = re.compile(
              rf"(?m)^## \[{re.escape(pyproject_version)}\] - "
              rf"(?P<date>[0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}})\s*$"
          )
          changelog_sections = list(section.finditer(changelog))
          if len(changelog_sections) != 1:
              raise SystemExit(
                  f"CHANGELOG.md must contain exactly one release section for {pyproject_version}"
              )
          try:
              dt.date.fromisoformat(changelog_sections[0].group("date"))
          except ValueError as exc:
              raise SystemExit("CHANGELOG.md release date is invalid") from exc

          section_match = changelog_sections[0]
          next_section = re.search(r"(?m)^## \[", changelog[section_match.end() :])
          section_end = (
              section_match.end() + next_section.start()
              if next_section is not None
              else len(changelog)
          )
          release_notes = changelog[section_match.start() : section_end]
          release_notes_lines = release_notes.splitlines()
          if len(release_notes_lines) < 2:
              raise SystemExit("CHANGELOG.md release section has no release notes")
          release_notes = "\n".join(release_notes_lines) + "\n"
          release_metadata = Path(os.environ["RUNNER_TEMP"]) / "release-metadata"
          release_metadata.mkdir(parents=True, exist_ok=True)
          with (release_metadata / "release-notes.md").open(
              "w", encoding="utf-8", newline="\n"
          ) as notes_file:
              notes_file.write(release_notes)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"value={pyproject_version}\n")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"RELEASE_VERSION={pyproject_version}\n")
          print(f"Release metadata, changelog, and build pins agree on {pyproject_version}")
          PY

      - name: Install frozen test dependencies
        run: |
          uv sync --frozen --all-extras
          npm ci --ignore-scripts

      - name: Run release quality gates
        run: |
          uv run --frozen --all-extras python -m pytest -q
          uv run --frozen --all-extras ruff check .
          uv run --frozen --all-extras ruff format --check .
          npm test
          npm audit --omit=dev

      - name: Run the real JPL SPK excerpt fixture
        shell: bash
        run: |
          kernel_path=$(uv run --frozen --all-extras python -c \
            "from pathlib import Path; import skyfield; print(Path(skyfield.__file__).parent / 'tests/data/de441-1969.bsp')")
          DESTINY_TEST_KERNEL="$kernel_path" \
          DESTINY_TEST_AT="1969-07-28T12:00:00Z" \
          uv run --frozen --all-extras python -m pytest -q tests/test_historical_skyfield.py

      - name: Download and verify the pinned official DE440s kernel
        shell: bash
        env:
          DE440S_URL: https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp
          DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
          DE440S_SIZE: "32726016"
        run: |
          set -euo pipefail
          umask 077
          kernel_dir=$(mktemp -d "$RUNNER_TEMP/destiny-de440s.XXXXXX")
          kernel_path="$kernel_dir/de440s.bsp"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --show-error \
            --silent \
            --connect-timeout 15 \
            --max-time 300 \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 3 \
            --retry-max-time 600 \
            --max-filesize "$DE440S_SIZE" \
            --remove-on-error \
            --output "$kernel_path" \
            "$DE440S_URL"
          actual_size=$(wc -c < "$kernel_path" | tr -d '[:space:]')
          if [[ "$actual_size" != "$DE440S_SIZE" ]]; then
            echo "DE440s size mismatch: expected $DE440S_SIZE, received $actual_size" >&2
            exit 1
          fi
          actual_sha256=$(sha256sum "$kernel_path" | cut -d ' ' -f 1)
          if [[ "$actual_sha256" != "$DE440S_SHA256" ]]; then
            echo "DE440s SHA-256 mismatch" >&2
            exit 1
          fi
          chmod 0444 "$kernel_path"
          echo "DESTINY_TEST_DE440S=$kernel_path" >> "$GITHUB_ENV"

      - name: Compare DE440s with the frozen JPL Horizons observations
        run: uv run --frozen --all-extras python -m pytest -q tests/test_historical_horizons.py

      - name: Audit the frozen production dependency set
        shell: bash
        run: |
          uv lock --check
          uv export \
            --frozen \
            --extra all \
            --no-dev \
            --no-emit-project \
            --output-file "$RUNNER_TEMP/destiny-production-requirements.txt"
          uv tool run --from pip-audit==2.10.1 pip-audit \
            --requirement "$RUNNER_TEMP/destiny-production-requirements.txt" \
            --disable-pip

      - name: Install pinned release build frontends
        run: python -m pip install --disable-pip-version-check build==1.5.0 twine==7.0.0

      - name: Prove byte-for-byte reproducible distributions
        shell: bash
        run: |
          build_root="$RUNNER_TEMP/reproducible-build"
          first_source="$build_root/source-one"
          second_source="$build_root/source-two"
          first_dist="$build_root/dist-one"
          second_dist="$build_root/dist-two"
          mkdir -p "$first_source" "$second_source" "$first_dist" "$second_dist"

          expected_wheel="destiny_agent_skill-${RELEASE_VERSION}-py3-none-any.whl"
          expected_sdist="destiny_agent_skill-${RELEASE_VERSION}.tar.gz"

          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$first_source"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$second_source"
          python -m build --outdir "$first_dist" "$first_source"
          python -m build --outdir "$second_dist" "$second_source"

          for directory in "$first_dist" "$second_dist"; do
            if ! diff -u \
              <(printf '%s\n' "$expected_sdist" "$expected_wheel" | sort) \
              <(find "$directory" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort); then
              echo "Build produced an unexpected distribution set in $directory." >&2
              exit 1
            fi
          done

          FIRST_SDIST="$first_dist/$expected_sdist" \
          SECOND_SDIST="$second_dist/$expected_sdist" \
          EXPECTED_SDIST_ROOT="destiny_agent_skill-${RELEASE_VERSION}" \
          python - <<'PY'
          import copy
          import gzip
          import os
          import tarfile
          import unicodedata
          from pathlib import Path, PurePosixPath

          expected_root = os.environ["EXPECTED_SDIST_ROOT"]

          def validate_structure(members: list[tarfile.TarInfo]) -> list[tarfile.TarInfo]:
              if not members:
                  raise ValueError("sdist is empty")
              seen = set()
              portable_seen = set()
              root_member = None
              for member in members:
                  name = member.name
                  path = PurePosixPath(name)
                  if (
                      not name
                      or "\\" in name
                      or path.is_absolute()
                      or any(part in {"", ".", ".."} for part in path.parts)
                      or path.as_posix() != name
                      or unicodedata.normalize("NFC", name) != name
                  ):
                      raise ValueError(f"unsafe or non-normalized sdist path: {name!r}")
                  if path.parts[0] != expected_root:
                      raise ValueError(f"sdist member escapes expected root: {name!r}")
                  if name in seen:
                      raise ValueError(f"duplicate sdist path: {name!r}")
                  portable_name = name.casefold()
                  if portable_name in portable_seen:
                      raise ValueError(f"non-portable colliding sdist path: {name!r}")
                  seen.add(name)
                  portable_seen.add(portable_name)
                  if not (member.isfile() or member.isdir()):
                      raise ValueError(
                          f"unsupported sdist member type for {name!r}; links/devices/FIFOs are forbidden"
                      )
                  if member.linkname:
                      raise ValueError(f"sdist member unexpectedly has a link target: {name!r}")
                  if name == expected_root:
                      root_member = member
              if root_member is None or not root_member.isdir():
                  raise ValueError("sdist must contain one directory at the expected root")
              return members

          fixture_root = tarfile.TarInfo(expected_root)
          fixture_root.type = tarfile.DIRTYPE
          fixture_symlink = tarfile.TarInfo(f"{expected_root}/leaks-outside-repository")
          fixture_symlink.type = tarfile.SYMTYPE
          fixture_symlink.linkname = "/etc/passwd"
          try:
              validate_structure([fixture_root, fixture_symlink])
          except ValueError as exc:
              if "links/devices/FIFOs are forbidden" not in str(exc):
                  raise
          else:
              raise SystemExit("Internal adversarial sdist symlink fixture was not rejected")

          def validate_canonical_archive(archive: Path, epoch: int) -> None:
              header = archive.read_bytes()[:10]
              if len(header) != 10 or header[:3] != b"\x1f\x8b\x08":
                  raise ValueError(f"canonical sdist has an invalid gzip header: {archive}")
              if header[3] != 0 or int.from_bytes(header[4:8], "little") != epoch:
                  raise ValueError(f"canonical sdist gzip metadata is not deterministic: {archive}")
              with tarfile.open(archive, "r:gz") as canonical:
                  members = validate_structure(canonical.getmembers())
                  names = [member.name for member in members]
                  if names != sorted(names):
                      raise ValueError(f"canonical sdist members are not sorted: {archive}")
                  for member in members:
                      expected_mode = 0o755 if member.isdir() or (member.mode & 0o111) else 0o644
                      if member.mode != expected_mode:
                          raise ValueError(f"canonical sdist mode is invalid: {member.name!r}")
                      if (
                          member.uid != 0
                          or member.gid != 0
                          or member.uname != ""
                          or member.gname != ""
                          or member.mtime != epoch
                          or member.pax_headers
                      ):
                          raise ValueError(
                              f"canonical sdist metadata is invalid: {member.name!r}"
                          )

          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          for variable in ("FIRST_SDIST", "SECOND_SDIST"):
              archive = Path(os.environ[variable])
              temporary = archive.with_name(archive.name + ".normalized")
              with tarfile.open(archive, "r:gz") as source, temporary.open("wb") as raw:
                  source_members = validate_structure(source.getmembers())
                  with gzip.GzipFile(
                      filename="",
                      mode="wb",
                      fileobj=raw,
                      compresslevel=9,
                      mtime=epoch,
                  ) as compressed:
                      with tarfile.open(
                          fileobj=compressed,
                          mode="w",
                          format=tarfile.PAX_FORMAT,
                      ) as target:
                          for original in sorted(source_members, key=lambda item: item.name):
                              member = copy.copy(original)
                              member.uid = 0
                              member.gid = 0
                              member.uname = ""
                              member.gname = ""
                              member.mtime = epoch
                              member.mode = (
                                  0o755
                                  if member.isdir() or (member.mode & 0o111)
                                  else 0o644
                              )
                              member.pax_headers = {}
                              payload = source.extractfile(original) if original.isfile() else None
                              target.addfile(member, payload)
              temporary.replace(archive)
              validate_canonical_archive(archive, epoch)
          PY

          for artifact in "$expected_wheel" "$expected_sdist"; do
            if ! cmp --silent "$first_dist/$artifact" "$second_dist/$artifact"; then
              echo "Reproducibility failure: $artifact differs between isolated builds." >&2
              sha256sum "$first_dist/$artifact" "$second_dist/$artifact" >&2
              exit 1
            fi
          done

          mkdir -p dist
          cp -- "$first_dist/$expected_wheel" "$first_dist/$expected_sdist" dist/
          python -m twine check dist/*
          echo "Both isolated builds produced byte-identical wheel and sdist artifacts."

      - name: Clean-install and smoke-test both accepted distributions
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/destiny-wheel"
          "$RUNNER_TEMP/destiny-wheel/bin/python" -m pip install \
            --disable-pip-version-check \
            dist/*.whl
          "$RUNNER_TEMP/destiny-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/destiny-wheel/bin/destiny" calendar 2026 8 26 --json \
            > "$RUNNER_TEMP/wheel-calendar.json"
          "$RUNNER_TEMP/destiny-wheel/bin/destiny" history --help \
            > "$RUNNER_TEMP/wheel-history-help.txt"
          "$RUNNER_TEMP/destiny-wheel/bin/python" -m json.tool \
            "$RUNNER_TEMP/wheel-calendar.json" > /dev/null

          python -m venv "$RUNNER_TEMP/destiny-sdist"
          "$RUNNER_TEMP/destiny-sdist/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            dist/*.tar.gz
          "$RUNNER_TEMP/destiny-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/destiny-sdist/bin/destiny" calendar 2026 8 26 --json \
            > "$RUNNER_TEMP/sdist-calendar.json"
          "$RUNNER_TEMP/destiny-sdist/bin/destiny" history --help \
            > "$RUNNER_TEMP/sdist-history-help.txt"
          "$RUNNER_TEMP/destiny-sdist/bin/python" -m json.tool \
            "$RUNNER_TEMP/sdist-calendar.json" > /dev/null
          "$RUNNER_TEMP/destiny-sdist/bin/python" -c \
            "import destiny; assert destiny.__version__ == '$RELEASE_VERSION'"

      - name: Create and verify release checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Store verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.version.outputs.value }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Store deterministic release notes internally
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest:
    name: Attest verified release artifacts
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download this workflow run's immutable artifact.
      id-token: write # Mint the short-lived Sigstore signing identity.
      attestations: write # Store provenance in this repository.
      artifact-metadata: write # Register attested artifact metadata with GitHub.
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Restore verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Validate the attestation subject boundary
        shell: bash
        run: |
          expected_wheel="destiny_agent_skill-${RELEASE_VERSION}-py3-none-any.whl"
          expected_sdist="destiny_agent_skill-${RELEASE_VERSION}.tar.gz"
          if find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q . || \
             ! diff -u \
               <(printf '%s\n' SHA256SUMS "$expected_sdist" "$expected_wheel" | sort) \
               <(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort); then
            echo "Unexpected attestation subject set." >&2
            find dist -mindepth 1 -maxdepth 2 -print >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    name: Publish the attested GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Download this workflow run's verified artifact.
      contents: write # Create the GitHub Release and upload its assets.
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      RELEASE_NOTES_PATH: release-metadata/release-notes.md

    steps:
      - name: Restore attested release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Restore deterministic release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata-${{ needs.build.outputs.version }}
          path: release-metadata

      - name: Validate the publication boundary
        shell: bash
        run: |
          expected_wheel="destiny_agent_skill-${RELEASE_VERSION}-py3-none-any.whl"
          expected_sdist="destiny_agent_skill-${RELEASE_VERSION}.tar.gz"
          if find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q . || \
             ! diff -u \
               <(printf '%s\n' SHA256SUMS "$expected_sdist" "$expected_wheel" | sort) \
               <(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort); then
            echo "Unexpected publication asset set." >&2
            find dist -mindepth 1 -maxdepth 2 -print >&2
            exit 1
          fi
          (cd dist && sha256sum --check SHA256SUMS)
          if [[ ! -f "$RELEASE_NOTES_PATH" ]] || \
             [[ $(find "$(dirname "$RELEASE_NOTES_PATH")" -mindepth 1 -maxdepth 1 -type f | wc -l) -ne 1 ]] || \
             find "$(dirname "$RELEASE_NOTES_PATH")" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "Unexpected internal release metadata artifact." >&2
            exit 1
          fi

      - name: Create, repair, or verify the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_title="Destiny $RELEASE_TAG"
          release_json="$RUNNER_TEMP/release.json"
          release_state="missing"

          read_remote_object() {
            local endpoint=$1
            local context=$2
            local record
            if ! record=$(gh api "$endpoint" --jq '[.object.type, .object.sha] | @tsv'); then
              echo "GitHub API failed while resolving $context." >&2
              return 1
            fi
            local object_type object_sha extra
            IFS=$'\t' read -r object_type object_sha extra <<< "$record"
            if [[ -n "$extra" ]] || \
               [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]] || \
               [[ "$object_type" != "commit" && "$object_type" != "tag" ]]; then
              echo "GitHub API returned an invalid object for $context." >&2
              return 1
            fi
            printf '%s\t%s\n' "$object_type" "$object_sha"
          }

          assert_remote_tag_and_main() {
            local checkpoint=$1
            local record object_type object_sha extra
            if ! record=$(read_remote_object \
              "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              "tag ref at $checkpoint"); then
              return 1
            fi
            IFS=$'\t' read -r object_type object_sha extra <<< "$record"

            local depth=0
            while [[ "$object_type" == "tag" ]]; do
              if ((depth >= 8)); then
                echo "Annotated tag peel depth exceeded at $checkpoint." >&2
                return 1
              fi
              ((depth += 1))
              if ! record=$(read_remote_object \
                "repos/$GH_REPO/git/tags/$object_sha" \
                "annotated tag object at $checkpoint"); then
                return 1
              fi
              IFS=$'\t' read -r object_type object_sha extra <<< "$record"
            done

            if [[ "$object_type" != "commit" ]] || [[ "$object_sha" != "$RELEASE_SHA" ]]; then
              echo "Remote tag moved or does not peel to $RELEASE_SHA at $checkpoint." >&2
              return 1
            fi

            if ! record=$(read_remote_object \
              "repos/$GH_REPO/git/ref/heads/main" \
              "remote main ref at $checkpoint"); then
              return 1
            fi
            local main_type main_sha
            IFS=$'\t' read -r main_type main_sha extra <<< "$record"
            if [[ "$main_type" != "commit" ]]; then
              echo "Remote main does not resolve directly to a commit at $checkpoint." >&2
              return 1
            fi

            local comparison compare_status merge_base
            if ! comparison=$(gh api \
              "repos/$GH_REPO/compare/$object_sha...$main_sha" \
              --jq '[.status, .merge_base_commit.sha] | @tsv'); then
              echo "GitHub compare API failed at $checkpoint." >&2
              return 1
            fi
            IFS=$'\t' read -r compare_status merge_base extra <<< "$comparison"
            if [[ -n "$extra" ]] || \
               [[ "$merge_base" != "$object_sha" ]] || \
               [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
              echo "Tagged commit is not reachable from remote main at $checkpoint." >&2
              return 1
            fi
            echo "Remote tag and main ancestry verified at $checkpoint."
          }

          assert_remote_tag_and_main "before release lookup or reuse"

          if gh release view "$RELEASE_TAG" \
            --json assets,body,isDraft,isImmutable,isPrerelease,name,tagName,targetCommitish \
            > "$release_json" 2>/dev/null; then
            release_state=$(python - "$release_json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          sha = os.environ["RELEASE_SHA"]
          expected_title = f"Destiny {tag}"
          expected_body = Path(os.environ["RELEASE_NOTES_PATH"]).read_bytes().decode("utf-8")

          def normalize_newlines(value: str) -> str:
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              return value if not value or value.endswith("\n") else value + "\n"

          expected_assets = {
              f"destiny_agent_skill-{version}-py3-none-any.whl",
              f"destiny_agent_skill-{version}.tar.gz",
              "SHA256SUMS",
          }
          actual_assets = [asset["name"] for asset in data["assets"]]

          if data["tagName"] != tag:
              raise SystemExit("Existing release tag metadata does not match the triggering tag")
          if data["name"] != expected_title:
              raise SystemExit("Existing release title does not match the expected title")
          if normalize_newlines(data.get("body") or "") != normalize_newlines(expected_body):
              raise SystemExit("Existing release notes do not exactly match CHANGELOG.md")
          if data["isPrerelease"] is not False:
              raise SystemExit("Stable SemVer releases must not be marked prerelease")
          if data["targetCommitish"] not in {sha, "main", tag}:
              raise SystemExit("Existing release target metadata is unexpected")
          if len(actual_assets) != len(set(actual_assets)):
              raise SystemExit("Existing release contains duplicate asset names")

          if data["isDraft"]:
              if data["isImmutable"]:
                  raise SystemExit("A reusable draft must not be immutable")
              unexpected = set(actual_assets) - expected_assets
              if unexpected:
                  raise SystemExit(
                      "Draft contains unexpected assets: " + ", ".join(sorted(unexpected))
                  )
              print("draft")
          else:
              if set(actual_assets) != expected_assets:
                  raise SystemExit("Published release asset names are not the exact expected set")
              print("published")
          PY
            )
          fi

          if [[ "$release_state" == "published" ]]; then
            existing_release="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing_release"
            gh release download "$RELEASE_TAG" --dir "$existing_release"
            if diff --brief --recursive dist "$existing_release"; then
              gh release view "$RELEASE_TAG" \
                --json body,isDraft,isPrerelease \
                > "$RUNNER_TEMP/idempotent-release.json"
              python - "$RUNNER_TEMP/idempotent-release.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_body = Path(os.environ["RELEASE_NOTES_PATH"]).read_bytes().decode("utf-8")

          def normalize_newlines(value: str) -> str:
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              return value if not value or value.endswith("\n") else value + "\n"

          if data["isDraft"] is not False or data["isPrerelease"] is not False:
              raise SystemExit("Published release state changed during idempotency verification")
          if normalize_newlines(data.get("body") or "") != normalize_newlines(expected_body):
              raise SystemExit("Published release notes changed during idempotency verification")
          PY
              assert_remote_tag_and_main "immediately before idempotent success"
              echo "Published release already contains the exact verified assets."
              exit 0
            fi
            echo "Published release assets differ from this reproducible build." >&2
            echo "Refusing to mutate published release history." >&2
            exit 1
          fi

          if [[ "$release_state" == "missing" ]]; then
            assert_remote_tag_and_main "immediately before draft creation"
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --target "$RELEASE_SHA" \
              --draft \
              --notes-file "$RELEASE_NOTES_PATH" \
              --title "$expected_title"
          elif [[ "$release_state" != "draft" ]]; then
            echo "Unexpected release state: $release_state" >&2
            exit 1
          fi

          assert_remote_tag_and_main "immediately before release asset upload"
          gh release upload "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --clobber

          gh release view "$RELEASE_TAG" \
            --json assets,body,isDraft,isImmutable,isPrerelease,name,tagName,targetCommitish \
            > "$RUNNER_TEMP/uploaded-draft.json"
          python - "$RUNNER_TEMP/uploaded-draft.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          sha = os.environ["RELEASE_SHA"]
          expected_body = Path(os.environ["RELEASE_NOTES_PATH"]).read_bytes().decode("utf-8")

          def normalize_newlines(value: str) -> str:
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              return value if not value or value.endswith("\n") else value + "\n"

          expected_assets = {
              f"destiny_agent_skill-{version}-py3-none-any.whl",
              f"destiny_agent_skill-{version}.tar.gz",
              "SHA256SUMS",
          }
          actual_assets = [asset["name"] for asset in data["assets"]]
          if data["isDraft"] is not True or data["isImmutable"]:
              raise SystemExit("Release must remain a mutable draft until verification completes")
          if data["isPrerelease"] is not False:
              raise SystemExit("Draft unexpectedly marked as a prerelease")
          if data["name"] != f"Destiny {tag}" or data["tagName"] != tag:
              raise SystemExit("Draft title or tag metadata changed unexpectedly")
          if normalize_newlines(data.get("body") or "") != normalize_newlines(expected_body):
              raise SystemExit("Draft release notes do not exactly match CHANGELOG.md")
          if data["targetCommitish"] not in {sha, "main", tag}:
              raise SystemExit("Draft target metadata is unexpected")
          if len(actual_assets) != 3 or set(actual_assets) != expected_assets:
              raise SystemExit("Draft does not contain exactly the three expected assets")
          PY

          uploaded_release="$RUNNER_TEMP/uploaded-release"
          mkdir -p "$uploaded_release"
          gh release download "$RELEASE_TAG" --dir "$uploaded_release"
          if ! diff --brief --recursive dist "$uploaded_release"; then
            echo "Uploaded draft assets differ from the verified local artifacts." >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" \
            --json body,isDraft,isPrerelease \
            > "$RUNNER_TEMP/prepublish-draft.json"
          python - "$RUNNER_TEMP/prepublish-draft.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_body = Path(os.environ["RELEASE_NOTES_PATH"]).read_bytes().decode("utf-8")

          def normalize_newlines(value: str) -> str:
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              return value if not value or value.endswith("\n") else value + "\n"

          if data["isDraft"] is not True or data["isPrerelease"] is not False:
              raise SystemExit("Release state changed immediately before publication")
          if normalize_newlines(data.get("body") or "") != normalize_newlines(expected_body):
              raise SystemExit("Release notes changed immediately before publication")
          PY

          assert_remote_tag_and_main "immediately before draft publication"
          gh release edit "$RELEASE_TAG" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "$expected_title" \
            --prerelease=false \
            --draft=false
          assert_remote_tag_and_main "immediately after draft publication"

          gh release view "$RELEASE_TAG" \
            --json assets,body,isDraft,isPrerelease,name,tagName \
            > "$RUNNER_TEMP/published-release.json"
          python - "$RUNNER_TEMP/published-release.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          expected_body = Path(os.environ["RELEASE_NOTES_PATH"]).read_bytes().decode("utf-8")

          def normalize_newlines(value: str) -> str:
              value = value.replace("\r\n", "\n").replace("\r", "\n")
              return value if not value or value.endswith("\n") else value + "\n"

          expected_assets = {
              f"destiny_agent_skill-{version}-py3-none-any.whl",
              f"destiny_agent_skill-{version}.tar.gz",
              "SHA256SUMS",
          }
          actual_assets = [asset["name"] for asset in data["assets"]]
          if data["isDraft"] or data["isPrerelease"]:
              raise SystemExit("Release was not published as a stable release")
          if data["name"] != f"Destiny {tag}" or data["tagName"] != tag:
              raise SystemExit("Published release metadata is incorrect")
          if normalize_newlines(data.get("body") or "") != normalize_newlines(expected_body):
              raise SystemExit("Published release notes do not exactly match CHANGELOG.md")
          if len(actual_assets) != 3 or set(actual_assets) != expected_assets:
              raise SystemExit("Published release asset set is incorrect")
          PY
          assert_remote_tag_and_main "at final post-publication success"
