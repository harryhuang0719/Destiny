name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Bootstrap and run offline tests
        run: python scripts/bootstrap.py --llm --research --dev --installer uv
      - name: Audit production Node dependencies
        run: npm audit --omit=dev
      - name: Smoke Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\destiny.ps1 doctor --json | Out-Null
          cmd /c "destiny.cmd doctor --json > NUL"

  jpl-spk-smoke:
    name: Real JPL SPK excerpt smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: python scripts/bootstrap.py --research --dev --installer uv
      - name: Run against Skyfield's real DE441 excerpt fixture
        shell: bash
        run: |
          kernel_path=$(.venv/bin/python -c "from pathlib import Path; import skyfield; print(Path(skyfield.__file__).parent / 'tests/data/de441-1969.bsp')")
          DESTINY_TEST_KERNEL="$kernel_path" \
          DESTINY_TEST_AT="1969-07-28T12:00:00Z" \
          .venv/bin/python -m pytest -q tests/test_historical_skyfield.py

  jpl-horizons-golden:
    name: Independent JPL Horizons golden
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
      - name: Install only the frozen Horizons test dependencies
        run: uv sync --frozen --extra research --extra dev --no-default-groups
      - name: Download and verify the pinned official DE440s kernel
        shell: bash
        env:
          DE440S_URL: https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp
          DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
          DE440S_SIZE: "32726016"
        run: |
          set -euo pipefail
          umask 077
          kernel_dir=$(mktemp -d "$RUNNER_TEMP/destiny-de440s.XXXXXX")
          kernel_path="$kernel_dir/de440s.bsp"
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --show-error \
            --silent \
            --connect-timeout 15 \
            --max-time 300 \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 3 \
            --retry-max-time 600 \
            --max-filesize "$DE440S_SIZE" \
            --remove-on-error \
            --output "$kernel_path" \
            "$DE440S_URL"
          actual_size=$(wc -c < "$kernel_path" | tr -d '[:space:]')
          if [[ "$actual_size" != "$DE440S_SIZE" ]]; then
            echo "DE440s size mismatch: expected $DE440S_SIZE, received $actual_size" >&2
            exit 1
          fi
          actual_sha256=$(sha256sum "$kernel_path" | cut -d ' ' -f 1)
          if [[ "$actual_sha256" != "$DE440S_SHA256" ]]; then
            echo "DE440s SHA-256 mismatch" >&2
            exit 1
          fi
          chmod 0444 "$kernel_path"
          echo "DESTINY_TEST_DE440S=$kernel_path" >> "$GITHUB_ENV"
      - name: Compare DE440s with the frozen JPL Horizons observations
        run: .venv/bin/python -m pytest -q tests/test_historical_horizons.py

  pip-fallback-smoke:
    name: Explicit pip installer fallback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Bootstrap without using uv
        shell: bash
        run: |
          python scripts/bootstrap.py \
            --llm \
            --research \
            --dev \
            --installer pip | tee "$RUNNER_TEMP/bootstrap-pip.log"
          grep -F '"installer": "pip"' "$RUNNER_TEMP/bootstrap-pip.log"
      - name: Audit production Node dependencies
        run: npm audit --omit=dev

  repository-hygiene:
    name: Public repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
      - name: Verify Python lock is current
        run: uv lock --check
      - name: Reject forbidden tracked artifacts and common secret patterns
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def unsafe_index_entries(payload: bytes) -> list[tuple[str, str]]:
              unsafe = []
              for record in payload.split(b"\0"):
                  if not record:
                      continue
                  metadata, path = record.split(b"\t", 1)
                  mode = metadata.split(b" ", 1)[0]
                  if mode not in {b"100644", b"100755"}:
                      unsafe.append((mode.decode("ascii"), os.fsdecode(path)))
              return unsafe

          adversarial_symlink = b"120000 " + b"0" * 40 + b" 0\tleaks-outside-repository\0"
          if unsafe_index_entries(adversarial_symlink) != [
              ("120000", "leaks-outside-repository")
          ]:
              raise SystemExit("Internal tracked-symlink rejection fixture failed")
          unsafe_entries = unsafe_index_entries(
              subprocess.check_output(["git", "ls-files", "-s", "-z"])
          )
          unsafe_paths = {path for _, path in unsafe_entries}

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_parts = {
              "node_modules", "__pycache__", ".venv", ".pytest_cache", ".ruff_cache",
              "data", "results", "reports",
          }
          forbidden_suffixes = {
              ".pyc", ".bsp", ".bpc", ".parquet", ".duckdb", ".sqlite",
              ".sqlite3", ".pdf", ".pem", ".key",
          }
          forbidden_names = {".env", "trials.ndjson"}
          bad = [f"{path} (unsafe tracked mode {mode})" for mode, path in unsafe_entries]
          suspicious_content = re.compile(
              rb"(gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|"
              rb"AKIA[0-9A-Z]{16}|BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY)"
          )
          for path in tracked:
              if path in unsafe_paths:
                  continue
              parts = set(path.split("/"))
              name = path.rsplit("/", 1)[-1]
              suffix = "." + name.rsplit(".", 1)[-1] if "." in name else ""
              if parts & forbidden_parts or suffix in forbidden_suffixes or name in forbidden_names:
                  bad.append(path)
                  continue
              file_path = Path(path)
              if file_path.stat().st_size > 5 * 1024 * 1024:
                  bad.append(path + " (tracked file >5 MiB)")
                  continue
              if suspicious_content.search(file_path.read_bytes()):
                  bad.append(path + " (possible secret)")
          if bad:
              raise SystemExit("Forbidden tracked artifacts:\n" + "\n".join(bad))
          print(f"Tracked-file hygiene OK: {len(tracked)} files")
          PY
      - name: Compile every Python source
        run: python3 -m compileall -q scripts tests

  python-dependency-audit:
    name: Python production dependency audit · ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
      - name: Export the frozen production dependency set
        shell: bash
        run: |
          uv lock --check
          uv export \
            --frozen \
            --extra all \
            --no-dev \
            --no-emit-project \
            --output-file "$RUNNER_TEMP/destiny-production-requirements.txt"
      - name: Fail on known Python dependency vulnerabilities
        shell: bash
        run: |
          uv tool run --from pip-audit==2.10.1 pip-audit \
            --requirement "$RUNNER_TEMP/destiny-production-requirements.txt" \
            --disable-pip

  wheel-smoke:
    name: Build and install Python artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.5.0 twine==7.0.0
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Clean wheel smoke (core and history command)
        shell: bash
        run: |
          python -m venv /tmp/destiny-wheel
          /tmp/destiny-wheel/bin/python -m pip install dist/*.whl
          /tmp/destiny-wheel/bin/destiny calendar 2026 8 26 --json > /tmp/calendar.json
          /tmp/destiny-wheel/bin/destiny history --help > /tmp/history-help.txt
          /tmp/destiny-wheel/bin/python -m json.tool /tmp/calendar.json > /dev/null
