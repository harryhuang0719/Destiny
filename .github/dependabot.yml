version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
      time: "09:15"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(python-deps)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      node-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(node-deps)"
